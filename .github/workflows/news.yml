name: Crypto news posts

on:
  schedule:
    # Время в UTC. 9 новостей в день. Летом по Вене это
    # 10:00, 11:30, 13:00, 14:30, 16:00, 17:30, 19:00, 20:30, 22:00 (зимой на час раньше).
    - cron: "0 8,11,14,17,20 * * *"
    - cron: "30 9,12,15,18 * * *"
  workflow_dispatch: # кнопка ручного запуска для теста

permissions:
  contents: write # чтобы сохранять posted.json (защита от повторов)

concurrency:
  group: crypto-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python news.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_PER_RUN: "1"
      - name: Save posted.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "update posted news"
          git push
